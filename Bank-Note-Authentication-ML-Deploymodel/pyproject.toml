[project]
name = "ml-deploy"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sweeskaran", email = "rsweeskaran@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "gunicorn==19.9.0",
    "httptools>=0.8.0",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "uvicorn>=0.53.0",
]

[project.scripts]
ml-deploy = "ml_deploy:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
